<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CZ TOUR BD - Join</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 92%;
            max-width: 420px;

            background: #151515;

            padding: 25px;

            border-radius: 16px;

            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            color: #ff2020;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            background: #090909;

            color: white;

            border: 1px solid #333;

            border-radius: 8px;

            outline: none;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #ff2020;

            color: white;

            font-size: 15px;

            font-weight: bold;
        }

        .back {
            background: transparent;

            border: 1px solid #ff2020;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            color: #ddd;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>🏆 CZ TOUR BD</h1>

    <p class="title">
        Free Fire Battle #01
    </p>


    <input
        id="playerName"
        type="text"
        placeholder="Player Name"
    >


    <input
        id="uid"
        type="text"
        placeholder="Free Fire UID"
    >


    <input
        id="phone"
        type="tel"
        placeholder="Phone Number"
    >


    <button id="submitBtn">
        ✅ CONFIRM JOIN
    </button>


    <button
        class="back"
        onclick="window.location.href='index.html'"
    >
        ← BACK HOME
    </button>


    <p id="message"></p>

</div>



<script type="module">

import { auth } from "./database.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


const playerName =
    document.getElementById("playerName");

const uid =
    document.getElementById("uid");

const phone =
    document.getElementById("phone");

const message =
    document.getElementById("message");


let currentUser = null;


onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href =
            "login.html";

        return;
    }

    currentUser = user;

});


document
    .getElementById("submitBtn")
    .addEventListener("click", async () => {

        if (
            !playerName.value ||
            !uid.value ||
            !phone.value
        ) {

            message.textContent =
                "❌ সব তথ্য পূরণ করুন।";

            return;
        }


        if (!currentUser) {

            message.textContent =
                "❌ আগে Login করুন।";

            return;
        }


        message.textContent =
            "⏳ তথ্য Submit হচ্ছে...";


        /*
        এখানে পরের ধাপে Firestore-এ
        tournament registration save করব।
        */


        setTimeout(() => {

            message.textContent =
                "✅ Tournament Join সফল হয়েছে!";

        }, 800);

    });

</script>


</body>

</html>
